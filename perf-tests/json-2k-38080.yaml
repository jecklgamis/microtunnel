# POST a ~2 KB JSON body to the http-sink service (port 38080, path /sink) on the relay
# (10.9.0.1), straight through the tunnel (no Envoy). Run from a host that
# has a route to the overlay, e.g. the Mac running microtunnel:
#   resonate run perf-tests/json-2k-38080.yaml   (from the repo root)
protocol: http

load:
  max_workers: 4000
  stages:
    - { duration: 5s,  workers: 400,  rate: 1000 }
    - { duration: 15s, workers: 400,  rate: 1000 }
    - { duration: 5s,  workers: 400,  rate: 2000 }
    - { duration: 15s, workers: 400,  rate: 2000 }
    - { duration: 5s,  workers: 1000, rate: 4000 }
    - { duration: 15s, workers: 1000, rate: 4000 }
    - { duration: 5s,  workers: 1000, rate: 8000 }
    - { duration: 15s, workers: 1000, rate: 8000 }
    - { duration: 5s,  workers: 1000, rate: 12000 }
    - { duration: 15s, workers: 1000, rate: 12000 }

http:
  timeout: 5s
  max_idle_conns: 4000
  targets:
    - method: POST
      url: http://10.9.0.1:38080/sink
      headers:
        Content-Type: application/json
        User-Agent: resonate-load-gen
      raw_body_file: perf-tests/payload-2k.json   # sent byte-for-byte; path is relative to the repo root

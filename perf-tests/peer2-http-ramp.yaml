# Capacity ramp through the tunnel: finds the request rate the path sustains.
# Each step ramps for 5s then holds for 15s. Compare the achieved rate and
# latency per step (results.jsonl has one record per request) to find where
# throughput stops tracking the target or p95/errors climb.
#
# Path: resonate -> peer-1 Envoy (:15052) -> tunnel -> relay -> peer-2 nginx
protocol: http

load:
  stages:
    - { duration: 5s,  workers: 400, rate: 1000 }
    - { duration: 15s, workers: 400, rate: 1000 }
    - { duration: 5s,  workers: 400, rate: 2000 }
    - { duration: 15s, workers: 400, rate: 2000 }
    - { duration: 5s,  workers: 400, rate: 4000 }
    - { duration: 15s, workers: 400, rate: 4000 }
    - { duration: 5s,  workers: 400, rate: 6000 }
    - { duration: 15s, workers: 400, rate: 6000 }
    - { duration: 5s,  workers: 400, rate: 8000 }
    - { duration: 15s, workers: 400, rate: 8000 }
    - { duration: 5s,  workers: 400, rate: 12000 }
    - { duration: 15s, workers: 400, rate: 12000 }

http:
  timeout: 5s
  max_idle_conns: 1000   # default 100 < workers: connections get re-dialed per request and exhaust client ports
  targets:
    - method: GET
      url: http://localhost:15052/
      headers:
        User-Agent: resonate-load-gen

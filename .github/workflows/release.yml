name: release

on:
  push:
    tags:
      - 'v*'

# Creating the release and uploading assets needs write access; the repository's default
# workflow token is read-only.
permissions:
  contents: write

jobs:
  # Nothing is released unless the tagged commit passes the fast gate.
  # (The end-to-end tests ran on the push to main that this tag points at.)
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check

  create-release:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate commit summary
        id: commits
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          else
            RANGE="${{ github.ref_name }}"
          fi
          NOTES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV
          echo "TITLE=${PREV_TAG:+Changes since $PREV_TAG}" >> $GITHUB_ENV
          {
            echo 'NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Create release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## ${{ env.TITLE || 'Changes' }}

            ${{ env.NOTES }}

  # Points the Homebrew formula in github.com/<owner>/homebrew-tap at this release's source
  # tarball. Needs a repository secret HOMEBREW_TAP_TOKEN: a token with write access to the
  # contents of the tap repository. Without it the job does nothing, and the formula's url
  # and sha256 have to be updated by hand.
  update-homebrew:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ github.ref_name }}
      TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
    steps:
      - name: Skip (no HOMEBREW_TAP_TOKEN)
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew formula was not updated."

      - name: Update the Homebrew formula
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          echo "url=$URL sha256=$SHA"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          sed -i -E "s|^(  url \").*(\")\$|\1${URL}\2|; s|^(  sha256 \").*(\")\$|\1${SHA}\2|" Formula/microtunnel.rb
          if git diff --quiet; then echo "formula already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "microtunnel ${TAG}"
          git push

  # The binary is a static Go executable (CGO_ENABLED=0): it has no glibc,
  # OpenSSL or libyaml dependency, so — unlike the original C build — there is
  # no need to compile inside a pinned old-distro container for compatibility,
  # and both architectures are cross-compiled from a single x86-64 runner.
  build-deb:
    needs: create-release
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build deb
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          make deb DEB_ARCH=${{ matrix.arch }} DEB_VERSION=$VERSION

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/*.deb

  build-rpm:
    needs: create-release
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install rpmbuild
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm

      - name: Build rpm
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          RPM_VER="${VERSION%%-*}"
          RPM_REL="${VERSION#*-}"
          if [ "$RPM_REL" = "$VERSION" ]; then RPM_REL="1"; fi
          make rpm RPM_ARCH=${{ matrix.arch }} RPM_VERSION=$RPM_VER RPM_RELEASE=$RPM_REL

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/rpm/RPMS/**/*.rpm

  # Plain static Linux binaries (amd64 + arm64) for people who don't want a
  # package: download, chmod +x, run. Same binaries as inside the deb/rpm.
  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build Linux binaries
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          make linux VERSION=$VERSION

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/microtunnel-linux-*

  # Static binaries for macOS (Apple silicon + Intel), cross-compiled on Linux.
  # Run with sudo; see "Running on macOS" in the README. Unsigned, so Gatekeeper
  # may require `xattr -d com.apple.quarantine <file>` after download.
  build-macos:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build macOS binaries
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          make macos VERSION=$VERSION

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/microtunnel-darwin-*

  # Universal (arm64 + amd64) macOS installer. Needs a macOS runner for lipo,
  # pkgbuild and productbuild. Not signed or notarized, so Gatekeeper needs
  # right-click > Open, or `sudo installer -pkg <file> -target /`.
  build-macos-pkg:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build macOS installer
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          make pkg VERSION=$VERSION

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/microtunnel-*-universal.pkg

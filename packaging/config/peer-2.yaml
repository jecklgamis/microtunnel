# microtunnel PEER config template (installed by the package).
# It contains NO keys or secrets: fill in the <...> values before starting the service.
#
# 1. Create this machine's key pair (writes peer-2.key and peer-2.crt):
#      sudo microtunnel keygen peer-2 -dir /etc/microtunnel
#    and give the printed public key to the relay's administrator.
# 2. Use the same pre_shared_key as the relay.
# 3. Set the relay's public key (printed by `microtunnel keygen relay` on the relay) and address.
interface: microtunnel0
port: 5040
private_key_file: /etc/microtunnel/peer-2.key
pre_shared_key: <same-secret-as-the-relay>
verbose: false
# Optional: let microtunnel assign this machine's overlay address itself
# (otherwise run microtunnel-create-tunnel.sh microtunnel0 10.9.0.3/24 10.9.0.0/24 first).
#tunnel_address: 10.9.0.3/24

peers:
  - public_key: <relay-public-key-hex>
    endpoint: <relay-host-or-ip>:5040
    allowed_ips:
      - 10.9.0.0/24
